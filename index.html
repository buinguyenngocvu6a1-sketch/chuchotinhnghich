<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Tường Vy</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    background: linear-gradient(135deg,#ff9ecf,#ff69b4,#ffc0cb);
    overflow:hidden;
    font-family: Arial, sans-serif;
}

h1{
    color:white;
    text-shadow:0 0 10px white;
    text-align:center;
}

button{
    padding:15px 35px;
    font-size:22px;
    border:none;
    border-radius:30px;
    cursor:pointer;
    background:white;
    color:#ff1493;
    font-weight:bold;
    transition:0.3s;
}

button:hover{
    transform:scale(1.1);
}

#message{
    margin-top:25px;
    color:white;
    font-size:35px;
    font-weight:bold;
    text-align:center;
    display:none;
    text-shadow:0 0 15px #fff;
    animation: glow 1s infinite alternate;
}

@keyframes glow{
    from{opacity:0.7;}
    to{opacity:1;}
}

/* Hiệu ứng lấp lánh */
.sparkle{
    position:absolute;
    width:6px;
    height:6px;
    background:white;
    border-radius:50%;
    animation:sparkle 3s linear infinite;
}

@keyframes sparkle{
    0%{
        transform:translateY(0) scale(0);
        opacity:1;
    }
    100%{
        transform:translateY(-100vh) scale(1.5);
        opacity:0;
    }
}
</style>
</head>

<body>

<h1>🎂 Bùi Ngọc Tường Vy 🎂</h1>

<button onclick="showMessage()">ẤN VÀO</button>

<div id="message">
🎉 Chúc Mừng Sinh Nhật Bùi Ngọc Tường Vy! 🎂<br>
Chúc bạn luôn vui vẻ, hạnh phúc và thành công! 💖
</div>

<script>
function showMessage(){
    document.getElementById("message").style.display = "block";
}

// Tạo hiệu ứng lấp lánh
for(let i=0;i<80;i++){
    let star=document.createElement("div");
    star.className="sparkle";
    star.style.left=Math.random()*100+"vw";
    star.style.top=Math.random()*100+"vh";
    star.style.animationDuration=(Math.random()*3+2)+"s";
    document.body.appendChild(star);
}
</script>

</body>
</html>
